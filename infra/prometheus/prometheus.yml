global:
  scrape_interval: 5s          # short interval so you SEE changes quickly during demos
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Broker internals via the JMX java agent running inside each broker
  - job_name: kafka-brokers
    static_configs:
      - targets: ["kafka1:7071", "kafka2:7071", "kafka3:7071"]
    relabel_configs:
      - source_labels: [__address__]
        regex: "(kafka\\d+):.*"
        target_label: broker
        replacement: "$1"

  # Consumer lag, topic offsets, ISR counts (from the client's point of view)
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Optional: Kafka Connect / Debezium workers (folders 15/16) — shown as down unless started
  - job_name: kafka-connect
    static_configs:
      - targets: ["connect:7072", "connect-2:7072"]

  # Python client metrics exporter (10-monitoring-prometheus-grafana/02_client_metrics_exporter.py) — down unless running
  - job_name: python-clients
    static_configs:
      - targets: ["host.docker.internal:8000"]
