# MirrorMaker 2 — dedicated mode (connect-mirror-maker). DG ch.8 / AKiA ch.16.3
# Cluster aliases: the alias becomes the PREFIX of mirrored topics on the target ("primary.mm2-orders").
clusters = primary, dr
primary.bootstrap.servers = kafka1:29092,kafka2:29092,kafka3:29092
dr.bootstrap.servers = kafka-dr:29092

# Active -> passive: only primary -> dr. (Active-active = enable both directions; the prefixes prevent loops.)
primary->dr.enabled = true
primary->dr.topics = mm2-.*
primary->dr.groups = mm2-.*
dr->primary.enabled = false

# The three connectors MM2 runs per flow:
#  MirrorSourceConnector     copies records + topic configs + ACLs, writes offset-syncs on the source cluster
#  MirrorCheckpointConnector translates consumer-group offsets -> <source>.checkpoints.internal on the target
#  MirrorHeartbeatConnector  emits heartbeats (lets you measure replication latency / topology)
sync.topic.configs.enabled = true
emit.checkpoints.enabled = true
emit.checkpoints.interval.seconds = 5
# also COMMIT translated offsets into dr's __consumer_offsets
sync.group.offsets.enabled = true
sync.group.offsets.interval.seconds = 5
refresh.topics.interval.seconds = 10
refresh.groups.interval.seconds = 10
# emit an offset-sync at least every 10 records (default 100)
offset.lag.max = 10

# Single-node DR cluster -> replication factor 1 for everything created there.
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
# offset-syncs lives on the SOURCE (primary, 3 brokers)
offset-syncs.topic.replication.factor = 3
dr.config.storage.replication.factor = 1
dr.offset.storage.replication.factor = 1
dr.status.storage.replication.factor = 1
primary.config.storage.replication.factor = 3
primary.offset.storage.replication.factor = 3
primary.status.storage.replication.factor = 3

tasks.max = 2
