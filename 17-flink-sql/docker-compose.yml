# -----------------------------------------------------------------------------
# 17-flink-sql — a small Flink session cluster that reads/writes the lab's Kafka.
#
#   flink-jobmanager   http://localhost:8085   Flink Web UI (jobs, checkpoints, watermarks, back pressure)
#   flink-taskmanager  8 task slots
#   sql-client         interactive Flink SQL shell:  docker compose -f 17-flink-sql/docker-compose.yml run --rm sql-client
#
# Requires: make up  (and for the CDC join: 16-cdc-debezium-mysql running, or at least its topics present)
# Start:    docker compose -f 17-flink-sql/docker-compose.yml up -d --build
# Stop:     docker compose -f 17-flink-sql/docker-compose.yml down -v
# -----------------------------------------------------------------------------
name: kafka-labs-flink

x-flink: &flink
  build: ./flink-image
  image: kafka-labs/flink:1.20.0
  volumes:
    - ./sql:/sql:ro
    - flink-checkpoints:/tmp/flink-checkpoints
  environment:
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      rest.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 8
      parallelism.default: 1
      jobmanager.memory.process.size: 640m
      taskmanager.memory.process.size: 1000m
      execution.checkpointing.interval: 10s
      execution.checkpointing.mode: EXACTLY_ONCE
      state.backend.type: hashmap
      state.checkpoints.dir: file:///tmp/flink-checkpoints
      table.exec.source.idle-timeout: 10s

services:
  flink-jobmanager:
    <<: *flink
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    command: jobmanager
    ports: ["8085:8081"]
    restart: unless-stopped

  flink-taskmanager:
    <<: *flink
    container_name: flink-taskmanager
    hostname: flink-taskmanager
    command: taskmanager
    depends_on: [flink-jobmanager]
    restart: unless-stopped

  sql-client:
    <<: *flink
    container_name: flink-sql-client
    command: ["bin/sql-client.sh", "-i", "/sql/00_init_tables.sql"]
    depends_on: [flink-jobmanager]
    profiles: ["cli"]          # only started with `docker compose run --rm sql-client`

volumes:
  flink-checkpoints:

networks:
  default:
    name: kafka-labs
    external: true
