// JAAS config for the broker's SASL/PLAIN listeners.
//  username/password  = the credentials THIS broker uses when it connects to itself / other brokers
//  user_<name>="pw"   = the user database for SASL/PLAIN (static! production => SCRAM or OAUTHBEARER)
KafkaServer {
    org.apache.kafka.common.security.plain.PlainLoginModule required
    username="admin"
    password="admin-secret"
    user_admin="admin-secret"
    user_alice="alice-secret"
    user_bob="bob-secret";
};
